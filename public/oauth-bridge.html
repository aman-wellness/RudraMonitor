<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Returning to Wellness Extract Invoice…</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f1115; color: #e5e7eb; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 18px; background: #22d3a2; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; color: #fff; margin: 0 0 6px; }
  p { font-size: 14px; color: #9ba3af; max-width: 340px; margin: 0 0 28px; line-height: 1.5; }
  .ok { color: #22d3a2; font-weight: 600; }
  .err { color: #fca5a5; font-weight: 500; }
  .small { font-size: 11px; color: #6b7280; margin-top: 32px; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">📷</div>
  <h1 id="hd">Finishing sign-in…</h1>
  <p id="msg">Please wait. You can close this tab in a moment.</p>
  <p class="small" id="dbg"></p>
</div>
<script>
  // Server-side handoff path — no custom-scheme redirect, no intent://.
  // Browser POSTs the OAuth `state` + `code` to our edge function, then
  // shows a "you can close this tab" message. The mobile app, which is
  // already in the background having opened a Custom Tab to land us
  // here, polls /oauth-mobile-retrieve?state=... on resume and finishes
  // the PKCE exchange itself. Verified-fails for the deep-link path on
  // HeyTapBrowser (and several other OEM browsers) — the URL data
  // never reaches Capacitor's appUrlOpen listener. This handoff is
  // bulletproof across every browser because the only thing the
  // browser has to do is a single HTTPS POST.

  (function () {
    var params = new URLSearchParams(window.location.search || "");
    var code = params.get("code") || "";
    var state = params.get("state") || "";
    var err = params.get("error") || params.get("error_description");

    var hd = document.getElementById("hd");
    var msg = document.getElementById("msg");
    var dbg = document.getElementById("dbg");

    if (err) {
      hd.textContent = "Sign-in error";
      hd.className = "err";
      msg.textContent = "The provider returned: " + err;
      return;
    }
    if (!code || !state) {
      hd.textContent = "Missing OAuth data";
      hd.className = "err";
      msg.textContent = "The callback URL didn't include a code or state. Try signing in again.";
      return;
    }

    // POST to our edge function — single shot, with a small client-side
    // retry in case the network blips.
    function deposit(retriesLeft) {
      fetch("https://api-ems.wellnessextract.com/functions/v1/oauth-mobile-deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ state: state, code: code }),
      }).then(function (r) {
        if (r.ok) {
          hd.textContent = "All set ✓";
          hd.className = "ok";
          msg.textContent = "You can close this tab. The Wellness Extract Invoice app will finish signing you in.";
          // Tiny convenience: also try the legacy custom-scheme. It does
          // nothing on browsers that block it; on Chrome it'll cleanly
          // close the tab via app launch.
          try {
            var f = document.createElement("iframe");
            f.style.display = "none";
            f.src = "com.wellnessextract.invoice://oauth-callback?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
            document.body.appendChild(f);
          } catch (e) {}
          return;
        }
        if (retriesLeft > 0) {
          setTimeout(function () { deposit(retriesLeft - 1); }, 800);
        } else {
          hd.textContent = "Couldn't finish sign-in";
          hd.className = "err";
          msg.textContent = "Network error talking to the backend. Open the app and try again.";
        }
      }).catch(function (e) {
        if (retriesLeft > 0) {
          setTimeout(function () { deposit(retriesLeft - 1); }, 800);
        } else {
          dbg.textContent = "Last error: " + (e && e.message ? e.message : String(e));
          hd.textContent = "Couldn't reach backend";
          hd.className = "err";
          msg.textContent = "Check your connection and try again.";
        }
      });
    }
    deposit(3);
  })();
</script>
</body>
</html>
