[package]
name = "rudrans-agent"
version = "0.2.18"
description = "Rudrans employee monitoring agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rudrans_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.32"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
active-win-pos-rs = "0.9"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
user-idle = "0.5"
starship-battery = "0.10"
# DLP — filesystem watcher for USB-transfer detection and SHA256 for file hashes
notify = "6"
notify-debouncer-mini = "0.4"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Pure-Rust UIA bindings used by browser_url::current_for_app on Windows.
# Replaces the older PowerShell subprocess approach which was both slow (~2s
# per poll) and unreliable when PowerShell startup latency spiked.
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.18"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
