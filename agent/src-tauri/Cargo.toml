[package]
name = "rudrans-agent"
version = "0.5.2"
description = "Rudrans employee monitoring agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rudrans_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.32"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
active-win-pos-rs = "0.9"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
user-idle = "0.5"
starship-battery = "0.10"
# DLP — filesystem watcher for USB-transfer detection and SHA256 for file hashes
notify = "6"
notify-debouncer-mini = "0.4"
sha2 = "0.10"
hex = "0.4"
# Live/Remote screen streaming.
#
# webrtc-rs 0.13 — used both by the legacy direct-to-dashboard signaling
# (kept for compatibility) and the new v0.3.0 LiveKit-native publisher
# (`livekit_native.rs`). The LiveKit Rust SDK pulls in `webrtc-sys` C++
# bindings that won't compile against modern Apple libc++; we sidestep
# that by speaking LiveKit's WebSocket+protobuf signaling ourselves and
# using webrtc-rs for the actual PeerConnection underneath.
webrtc = "0.13"
# URL parsing for WHIP Location header resolution.
url = "2"
# Pure-Rust LiveKit protocol bindings (just prost-generated protobufs —
# no libwebrtc, builds clean on every platform). Used for SignalRequest /
# SignalResponse / TrackInfo messages over the SFU's WebSocket.
livekit-protocol = "0.7"
prost = "0.12"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# StreamExt/SinkExt for the realtime WSS split() pattern; transitively
# present via tokio-tungstenite but we depend on it directly so the
# linker keeps the symbols.
futures-util = { version = "0.3", default-features = false }
# Percent-encoding for the anon key in the realtime WSS URL query.
urlencoding = "2"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
# Remote Desktop: cross-platform input synthesis (CGEvent on macOS, SendInput
# on Windows) + text clipboard. Used by the Remote tab's WebRTC data channel.
enigo = "0.3"
arboard = { version = "3", default-features = false }
# Trait-objects in async fns — used by the platform-agnostic
# Capturer / Encoder traits in capture/ and encode/.
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ============================================================
# v0.3.0 native screen-capture + hardware encode (Phase-1 spec).
# Replaces the ffmpeg subprocess pipeline on macOS for a 4-5×
# CPU win (~3-5% vs ~15-20% on Apple Silicon at 1080p30).
# ============================================================
[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit — native Apple framework for screen capture.
# Direct delegate callbacks deliver IOSurface-backed CVPixelBuffers
# at the OS's native refresh rate; we throttle to TARGET_FPS inside
# our delegate so we never burn CPU rendering frames we'd just drop.
screencapturekit = "0.3"
# VideoToolbox — hardware H.264 encoder. Same chip that QuickTime
# uses; pushes through Apple Silicon's media engine at near-zero
# CPU cost. Output is Annex-B NAL stream that webrtc-rs's
# TrackLocalStaticSample accepts directly — same shape as the
# ffmpeg path emitted, so the downstream WHIP pipeline stays
# unchanged.
core-foundation = "0.10"
core-graphics = "0.24"
# Match the exact crates `screencapturekit` re-exports types from
# (core-media-rs / core-video-rs, NOT the older core-media/core-video).
# If we mix versions, we get duplicate-type errors at the boundary.
core-media-rs = "0.3"
core-video-rs = "0.3"
objc2 = "0.5"
objc2-foundation = "0.2"

# Pure-Rust UIA bindings used by browser_url::current_for_app on Windows.
# Replaces the older PowerShell subprocess approach which was both slow (~2s
# per poll) and unreliable when PowerShell startup latency spiked.
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.18"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
