name: Build Mobile APK

# Builds an Android APK for the Wellness Extract Invoice mobile camera app.
# Produces both a debug APK (auto-signed, installable for testing) and an
# unsigned release APK (sign locally with your release keystore).
#
# Trigger paths:
#   - manual: Actions tab → "Build Mobile APK" → Run workflow
#   - push to main when mobile/ changes
#
# Output: GitHub Actions artifact "wellness-extract-invoice-apk" containing
# both APKs. Download from the workflow run page.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        working-directory: mobile
        run: npm ci

      - name: Build web bundle (Vite)
        working-directory: mobile
        env:
          # Production Supabase backend. If you need a different env for the
          # CI build, override via repo secrets and reference here.
          VITE_SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL || 'https://api-ems.wellnessextract.com' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor → Android
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      # Stable debug-signing keystore. Vanilla `assembleDebug` would
      # generate a fresh debug.keystore per CI run, producing a different
      # SHA-256 fingerprint each time — which breaks Android App Links
      # because the OS verifies the running APK's fingerprint against
      # /.well-known/assetlinks.json. Installing the secret keystore at
      # the canonical debug path makes every build deterministic.
      - name: Install stable debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 not set — falling back to gradle default debug keystore"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          # Tell Gradle to use our alias + password
          cat >> mobile/android/gradle.properties <<EOF

          # Stable debug signing (App Links assetlinks.json depends on
          # this fingerprint staying constant across CI builds).
          RELEASE_STORE_FILE=${HOME}/.android/debug.keystore
          RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASS }}
          EOF
          # Override the default debug signing config in the app gradle.
          cat >> mobile/android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("${HOME}/.android/debug.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASS }}"
                      keyAlias "${{ secrets.KEYSTORE_KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEYSTORE_KEY_PASS }}"
                  }
              }
          }
          EOF
          echo "Stable keystore installed; SHA-256:"
          $JAVA_HOME/bin/keytool -list -v -keystore ~/.android/debug.keystore \
            -alias "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASS }}" 2>/dev/null | grep "SHA256:"

      - name: Build debug APK (auto-signed, installable)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned — sign locally)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Show APK locations + sizes
        run: |
          echo "=== Debug APK ==="
          ls -la mobile/android/app/build/outputs/apk/debug/ || true
          echo
          echo "=== Release APK (unsigned) ==="
          ls -la mobile/android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wellness-extract-invoice-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the debug APK to the production downloads directory so the
      # landing page link (ems.wellnessextract.com/downloads/wellness-extract-invoice.apk)
      # always serves the latest build. Only runs on push to main — manual
      # workflow_dispatch builds stay in artifacts only.
      - name: Publish APK to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "⚠️  EC2_SSH_KEY or EC2_HOST secret not set — skipping auto-publish."
            echo "Set both secrets to enable, or download the artifact and upload manually."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/agent.pem
          chmod 600 ~/.ssh/agent.pem
          ssh-keyscan -H "${EC2_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/agent.pem mobile/android/app/build/outputs/apk/debug/app-debug.apk \
              "$EC2_HOST:/tmp/wellness-extract-invoice.apk"
          ssh -i ~/.ssh/agent.pem "$EC2_HOST" '
            sudo mv /tmp/wellness-extract-invoice.apk /opt/rudrans-downloads/wellness-extract-invoice.apk
            sudo chown www-data:www-data /opt/rudrans-downloads/wellness-extract-invoice.apk
            sudo chmod 644 /opt/rudrans-downloads/wellness-extract-invoice.apk
          '
          echo "✓ APK published to https://ems.wellnessextract.com/downloads/wellness-extract-invoice.apk"
