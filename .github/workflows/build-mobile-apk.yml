name: Build Mobile APK

# Builds an Android APK for the Rudrans Invoice mobile camera app.
# Produces both a debug APK (auto-signed, installable for testing) and an
# unsigned release APK (sign locally with your release keystore).
#
# Trigger paths:
#   - manual: Actions tab → "Build Mobile APK" → Run workflow
#   - push to main when mobile/ changes
#
# Output: GitHub Actions artifact "wellness-extract-invoice-apk" containing
# both APKs. Download from the workflow run page.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        working-directory: mobile
        run: npm ci

      - name: Build web bundle (Vite)
        working-directory: mobile
        env:
          # Production Supabase backend. If you need a different env for the
          # CI build, override via repo secrets and reference here.
          VITE_SUPABASE_URL: ${{ secrets.MOBILE_SUPABASE_URL || 'https://api-ems.wellnessextract.com' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.MOBILE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor → Android
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      # Stable debug-signing keystore. Vanilla `assembleDebug` would
      # generate a fresh debug.keystore per CI run, producing a different
      # SHA-256 fingerprint each time — which breaks Android App Links
      # because the OS verifies the running APK's fingerprint against
      # /.well-known/assetlinks.json. Installing the secret keystore at
      # the canonical debug path makes every build deterministic.
      - name: Install stable debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 not set — falling back to gradle default debug keystore"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          # Tell Gradle to use our alias + password
          cat >> mobile/android/gradle.properties <<EOF

          # Stable debug signing (App Links assetlinks.json depends on
          # this fingerprint staying constant across CI builds).
          RELEASE_STORE_FILE=${HOME}/.android/debug.keystore
          RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASS }}
          EOF
          # Override the default debug signing config in the app gradle.
          cat >> mobile/android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("${HOME}/.android/debug.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASS }}"
                      keyAlias "${{ secrets.KEYSTORE_KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEYSTORE_KEY_PASS }}"
                  }
              }
          }
          EOF
          echo "Stable keystore installed; SHA-256:"
          $JAVA_HOME/bin/keytool -list -v -keystore ~/.android/debug.keystore \
            -alias "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASS }}" 2>/dev/null | grep "SHA256:"

      - name: Build debug APK (auto-signed, installable)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned — sign locally)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Show APK locations + sizes
        run: |
          echo "=== Debug APK ==="
          ls -la mobile/android/app/build/outputs/apk/debug/ || true
          echo
          echo "=== Release APK (unsigned) ==="
          ls -la mobile/android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wellness-extract-invoice-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the debug APK to the Supabase `releases` storage bucket so
      # the landing page download button always serves the latest build.
      # Only runs on push to main — manual workflow_dispatch builds stay
      # in artifacts only. The landing page MobileAppSection links at
      # https://api-ems.wellnessextract.com/storage/v1/object/public/releases/Wellness-Extract-Invoice-latest-debug.apk
      # which this step keeps current.
      - name: Publish APK to Supabase storage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SR_KEY:           ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BASE_URL: ${{ secrets.SUPABASE_BASE_URL }}
        run: |
          if [ -z "$SR_KEY" ] || [ -z "$SUPABASE_BASE_URL" ]; then
            echo "⚠️  SUPABASE_SERVICE_ROLE_KEY or SUPABASE_BASE_URL secret not set — skipping auto-publish."
            echo "Download the artifact and upload manually if needed."
            exit 0
          fi
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          URL="${SUPABASE_BASE_URL}/storage/v1/object/releases/Wellness-Extract-Invoice-latest-debug.apk"
          # Stable filename → upsert via the x-upsert header so the
          # second-and-subsequent builds overwrite cleanly without 409.
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            --max-time 600 --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$URL" \
            -H "Authorization: Bearer $SR_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK")
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || {
            echo "APK upload failed: HTTP $HTTP"; cat /tmp/r.json; exit 1;
          }
          echo "✓ APK published — ${SUPABASE_BASE_URL}/storage/v1/object/public/releases/Wellness-Extract-Invoice-latest-debug.apk"
