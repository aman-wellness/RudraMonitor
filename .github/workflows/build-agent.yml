# Cross-platform agent build pipeline.
# Builds the Tauri agent on each OS's native runner (macOS/Windows/Linux) so the produced
# .pkg/.msi/.deb installers carry the right toolchain artifacts (WiX for MSI, dpkg for deb,
# Apple codesign hooks for pkg). Each artifact is uploaded to the Supabase Storage
# `releases` bucket so the dashboard's Setup page download buttons resolve.
#
# Triggers:
#   - Manual dispatch (Actions tab → Run workflow)
#   - Push of a tag matching v* (release flow)
#
# Required GitHub repo secrets:
#   SUPABASE_ACCESS_TOKEN              — sbp_… personal access token
#   TAURI_SIGNING_PRIVATE_KEY          — full contents of ~/.tauri/trackforce-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — empty string if generated without password
# Optional:
#   SUPABASE_PROJECT_REF               — defaults to ttjazaxjhzvrzhptrpmd
#
# This workflow builds OS installers (.pkg/.msi/.deb) AND updater bundles
# (.app.tar.gz/.msi.zip/.AppImage.tar.gz) signed with the Tauri updater key.
# After all builds finish, the `manifest` job aggregates the signatures into
# latest.json so existing agents can auto-update.

name: Build & Publish Agent

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  SUPABASE_BASE_URL: ${{ secrets.SUPABASE_BASE_URL || 'https://api.rudrans.com' }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ttjazaxjhzvrzhptrpmd' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: app
            artifact_glob: agent/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            remote_name: Security-Assistant-macOS-arm64-${{ github.ref_name }}.pkg
            packager: pkg
          # macOS Intel: cross-compile from macos-14 (ARM) using rust target.
          # macos-13 (Intel) GitHub runners are deprecated and pool is unreliable.
          - os: macos-14
            target: x86_64-apple-darwin
            bundle: app
            artifact_glob: agent/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            remote_name: Security-Assistant-macOS-x64-${{ github.ref_name }}.pkg
            packager: pkg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            artifact_glob: agent/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            remote_name: Security-Assistant-Windows-${{ github.ref_name }}.msi
            packager: passthrough
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact_glob: agent/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            remote_name: security-assistant_${{ github.ref_name }}_amd64.deb
            packager: passthrough

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # macos-14 runner ships Xcode 15.4 by default. webrtc-sys (the
      # libwebrtc bindings LiveKit pulls in transitively) doesn't compile
      # against the 14.5 SDK's newer libc++ — fails with
      #   error: implicit instantiation of undefined template
      #          'std::__pointer_traits_element_type<rust::Slice<…>::iterator>'
      # Pinning to Xcode 15.2 (macOS 14.0 SDK, older libc++) sidesteps it.
      # Xcode_15.2.app is preinstalled on every macos-14 image.
      - name: Pin Xcode for webrtc-sys C++ compat
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libx11-dev \
            libxdo-dev \
            libxss-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libdrm-dev

      - name: Install agent JS deps
        working-directory: agent
        run: npm ci || npm install

      # GitHub Secrets sometimes preserve trailing whitespace/newline from paste,
      # which breaks Tauri's base64 decode (`Invalid symbol 10, offset N`).
      # Strip ALL whitespace before passing to the build.
      - name: Sanitize signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          CLEAN=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN" >> "$GITHUB_ENV"
          echo "::add-mask::$CLEAN"
          echo "Sanitized signing key (length: ${#CLEAN})"

      # Drop the right ffmpeg binary into resources/ so Tauri bundles it inside
      # the .app / .msi / .deb. Macs need this for TCC reasons (a child binary
      # downloaded at runtime gets its own permission identity and macOS keeps
      # re-prompting). Bundling means ffmpeg lives inside the signed bundle and
      # inherits the parent process's Screen Recording grant. Same idea on
      # Windows and Linux just for first-clip latency.
      - name: Bundle ffmpeg for ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent/src-tauri/resources
          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              URL="https://api.rudrans.com/storage/v1/object/public/ffmpeg/ffmpeg-macos-universal"
              OUT="agent/src-tauri/resources/ffmpeg"
              ;;
            x86_64-pc-windows-msvc)
              URL="https://api.rudrans.com/storage/v1/object/public/ffmpeg/ffmpeg-windows-x64.exe"
              OUT="agent/src-tauri/resources/ffmpeg.exe"
              ;;
            x86_64-unknown-linux-gnu)
              URL="https://api.rudrans.com/storage/v1/object/public/ffmpeg/ffmpeg-linux-x64"
              OUT="agent/src-tauri/resources/ffmpeg"
              ;;
            *)
              echo "no ffmpeg mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          curl -fL --retry 3 "$URL" -o "$OUT"
          chmod +x "$OUT" || true
          ls -lh "$OUT"

      # Import the self-signed macOS code-signing cert into a temporary
      # keychain. Tauri's bundler will pick up APPLE_SIGNING_IDENTITY and
      # run `codesign --force --sign ... --options runtime --entitlements
      # entitlements.plist` automatically. The cert produces a stable
      # Designated Requirement across builds → macOS TCC keeps Screen
      # Recording / Accessibility grants persistent on auto-update.
      - name: Import macOS code-signing cert
        if: matrix.os == 'macos-14'
        env:
          P12_B64: ${{ secrets.RUDRANS_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.RUDRANS_CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RUDRANS_KEYCHAIN_PASSWORD }}
        run: |
          # The p12 must be generated with `openssl pkcs12 -export -legacy` —
          # OpenSSL 3+ defaults to AES-256-CBC encryption which macOS's
          # `security` CLI cannot parse (fails with "MAC verification failed
          # during PKCS12 import"). -legacy keeps the old 3DES/RC2 envelope
          # that SecKeychainItemImport understands.
          printf '%s' "$P12_B64" | openssl base64 -A -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          echo "Imported. Identities now available:"
          security find-identity -v -p codesigning build.keychain

      - name: Build agent
        working-directory: agent
        env:
          # TAURI_SIGNING_PRIVATE_KEY is set above via GITHUB_ENV
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri 2's macOS bundler reads this env var to invoke codesign with
          # the matching identity from the build keychain. tauri.conf.json
          # also declares it as a fallback for local builds.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-14' && 'Rudrans Software Code Signing' || '' }}
        run: npm run tauri build -- --bundles ${{ matrix.bundle }} --target ${{ matrix.target }}

      # Read the actual product version from tauri.conf.json so artifact names
      # are deterministic across triggers (push tag, workflow_dispatch on main, …).
      # Without this, dispatch-on-main runs overwrite tag runs in Storage.
      - name: Read product version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version v$VERSION (from tauri.conf.json, not ref_name)"

      # Compute the friendly remote_name for the OS installer (.pkg / .msi
      # / .deb) using the runtime VERSION, not the matrix-level
      # `github.ref_name` placeholder. workflow_dispatch runs from main
      # would otherwise upload as `…-main.pkg` and the setup page (which
      # expects `…-v0.2.33.pkg`) would 404.
      - name: Compute remote artifact name
        id: remote
        shell: bash
        run: |
          V="v${{ steps.version.outputs.version }}"
          # Strip the templated ref_name and replace with the version.
          NAME="${{ matrix.remote_name }}"
          NEW="${NAME//${{ github.ref_name }}/$V}"
          echo "name=$NEW" >> "$GITHUB_OUTPUT"
          echo "remote=$NEW (was ${{ matrix.remote_name }})"

      # Collect the updater-format bundle (.tar.gz / .msi) AND its .sig file
      # produced by Tauri when TAURI_SIGNING_PRIVATE_KEY is set. We need both for
      # the latest.json manifest.
      - name: Collect updater bundle + signature
        id: updater
        shell: bash
        run: |
          BASE="agent/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          # Tauri writes the updater archive with the productName ("TrackForce
          # Agent" — space in the filename) which breaks Supabase Storage URLs,
          # so we rename to a URL-safe hyphenated form before upload. We use a
          # case statement (NOT associative arrays — macOS ships bash 3.2 which
          # doesn't support `declare -A`).
          # Tauri 2 updater bundle naming (verified against actual build output):
          #   macOS:   <name>.app.tar.gz   + .app.tar.gz.sig
          #   Windows MSI:  <name>.msi      + .msi.sig         (not wrapped in .zip!)
          #   Windows NSIS: <name>.exe      + .exe.sig
          #   AppImage:     <name>.AppImage + .AppImage.sig    (newer Tauri)
          for sub in macos msi nsis appimage deb; do
            case "$sub" in
              macos)    EXT="app.tar.gz" ;;
              msi)      EXT="msi" ;;
              nsis)     EXT="exe" ;;
              appimage) EXT="AppImage" ;;
              deb)      EXT="deb" ;;
            esac
            for f in "$BASE/$sub"/*."$EXT"; do
              if [ -f "$f" ] && [ -f "${f}.sig" ]; then
                echo "found: $f"
                SAFE="Security-Assistant-${{ matrix.target }}-v${{ steps.version.outputs.version }}.${EXT}"
                cp "$f" "agent/$SAFE"
                cp "${f}.sig" "agent/${SAFE}.sig"
                echo "bundle=agent/$SAFE" >> "$GITHUB_OUTPUT"
                echo "sig=agent/${SAFE}.sig" >> "$GITHUB_OUTPUT"
                echo "name=$SAFE" >> "$GITHUB_OUTPUT"
                break 2
              fi
            done
          done

      - name: Upload updater bundle to Supabase
        if: steps.updater.outputs.bundle != ''
        shell: bash
        run: |
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          for f in "${{ steps.updater.outputs.bundle }}" "${{ steps.updater.outputs.sig }}"; do
            REMOTE=$(basename "$f")
            URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/${REMOTE}"
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f")
            if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
              HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
                -X PUT "$URL" \
                -H "Authorization: Bearer $SR_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$f")
            fi
            [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "updater upload $f failed: $HTTP"; cat /tmp/r.json; exit 1; }
            echo "Uploaded $REMOTE"
          done

      # Save the signature contents + URL so the manifest job can build latest.json
      - name: Save updater metadata
        if: steps.updater.outputs.bundle != ''
        shell: bash
        run: |
          NAME="${{ steps.updater.outputs.name }}"
          SIG=$(cat "${{ steps.updater.outputs.sig }}")
          URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/${NAME}"
          mkdir -p meta
          cat > "meta/${{ matrix.target }}.json" <<EOF
          { "target": "${{ matrix.target }}", "url": "$URL", "signature": $(jq -Rs '.' <<<"$SIG") }
          EOF

      - name: Upload metadata as artifact
        if: steps.updater.outputs.bundle != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-meta-${{ matrix.target }}
          path: meta/${{ matrix.target }}.json

      - name: Wrap macOS .app into .pkg
        if: matrix.packager == 'pkg'
        run: |
          APP_PATH=$(ls -d agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          STAGE=agent/dist-mac/stage
          SCRIPTS_DIR=agent/dist-mac/scripts
          rm -rf "$STAGE" "$SCRIPTS_DIR"
          mkdir -p "$STAGE/Applications" "$SCRIPTS_DIR" agent/dist-mac
          cp -R "$APP_PATH" "$STAGE/Applications/"

          # Use the externally-tracked postinstall (agent/scripts/pkg-scripts/postinstall)
          # so local-dev pkg builds (agent/scripts/build-mac-pkg.sh) and CI builds run
          # the exact same logic. The script (a) imports our self-signed root CA into
          # the System keychain so the .app's signature is trusted, (b) strips the
          # quarantine xattr so Gatekeeper doesn't warn on first launch, and (c) resets
          # any stale TCC entries from prior ad-hoc-signed builds so Screen Recording
          # gets re-granted ONCE against the new stable signing identity.
          cp agent/scripts/pkg-scripts/postinstall "$SCRIPTS_DIR/postinstall"
          chmod 755 "$SCRIPTS_DIR/postinstall"

          # Use the actual product version from tauri.conf.json so each pkg's
          # Info.plist version matches the .app inside it. The previous hard-
          # coded "0.1.0" was visibly stale in Installer.app's UI.
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")

          pkgbuild --root "$STAGE" \
            --identifier com.rudrans.agent \
            --version "$VERSION" \
            --install-location "/" \
            --scripts "$SCRIPTS_DIR" \
            "agent/dist-mac/${{ steps.remote.outputs.name }}"

      - name: Locate artifact (passthrough)
        if: matrix.packager == 'passthrough'
        id: passthrough
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.artifact_glob }} | head -1)
          mkdir -p agent/dist
          cp "$FILE" "agent/dist/${{ steps.remote.outputs.name }}"
          echo "path=agent/dist/${{ steps.remote.outputs.name }}" >> $GITHUB_OUTPUT

      - name: Upload to Supabase Storage
        shell: bash
        run: |
          if [ "${{ matrix.packager }}" = "pkg" ]; then
            ARTIFACT="agent/dist-mac/${{ steps.remote.outputs.name }}"
          else
            ARTIFACT="agent/dist/${{ steps.remote.outputs.name }}"
          fi
          # Resolve service_role key
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          UPLOAD_URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/${{ steps.remote.outputs.name }}"
          # Upsert: PUT replaces if exists.
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer $SR_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ARTIFACT")
          if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -X PUT "$UPLOAD_URL" \
              -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$ARTIFACT")
          fi
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "upload failed: HTTP $HTTP"; cat /tmp/r.json; exit 1
          fi
          echo "Uploaded → ${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/${{ steps.remote.outputs.name }}"

      - name: Upload artifact to GitHub run (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.remote.outputs.name }}
          path: |
            agent/dist-mac/${{ steps.remote.outputs.name }}
            agent/dist/${{ steps.remote.outputs.name }}
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # After all OS builds finish, gather the per-target signature metadata into a
  # single latest.json and upload it. Existing agents poll this every 30 min;
  # when the version changes, they download + verify + install + restart.
  # ---------------------------------------------------------------------------
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-target metadata artifacts
        uses: actions/download-artifact@v4
        with:
          path: meta-all
          pattern: updater-meta-*
          merge-multiple: true

      - name: Build latest.json
        id: manifest
        run: |
          set -e
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Map target → tauri platform key
          declare -A KEY=(
            [aarch64-apple-darwin]=darwin-aarch64
            [x86_64-apple-darwin]=darwin-x86_64
            [x86_64-pc-windows-msvc]=windows-x86_64
            [x86_64-unknown-linux-gnu]=linux-x86_64
          )
          PLATFORMS_JSON=""
          for f in meta-all/*.json; do
            [ -f "$f" ] || continue
            TARGET=$(jq -r '.target' "$f")
            URL=$(jq -r '.url' "$f")
            SIG=$(jq -r '.signature' "$f")
            PKEY="${KEY[$TARGET]:-}"
            [ -z "$PKEY" ] && continue
            ENTRY=$(jq -n --arg s "$SIG" --arg u "$URL" '{signature:$s,url:$u}')
            if [ -z "$PLATFORMS_JSON" ]; then PLATFORMS_JSON="\"$PKEY\":$ENTRY"
            else PLATFORMS_JSON+=",\"$PKEY\":$ENTRY"; fi
          done
          cat > /tmp/latest.json <<EOF
          { "version": "$VERSION", "notes": "TrackForce Agent v$VERSION", "pub_date": "$PUB_DATE", "platforms": { $PLATFORMS_JSON } }
          EOF
          jq . /tmp/latest.json
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload latest.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/latest.json"
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -X POST "$URL" -H "Authorization: Bearer $SR_KEY" \
            -H "Content-Type: application/json" --data-binary "@/tmp/latest.json")
          if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -X PUT "$URL" -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/json" --data-binary "@/tmp/latest.json")
          fi
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "upload failed: $HTTP"; cat /tmp/r.json; exit 1; }
          echo "✅ latest.json published → ${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/latest.json"
