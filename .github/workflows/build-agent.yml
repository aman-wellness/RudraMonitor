# Cross-platform agent build pipeline.
# Builds the Tauri agent on each OS's native runner (macOS/Windows/Linux) so the produced
# .pkg/.msi/.deb installers carry the right toolchain artifacts (WiX for MSI, dpkg for deb,
# Apple codesign hooks for pkg). Each artifact is uploaded to the Supabase Storage
# `releases` bucket so the dashboard's Setup page download buttons resolve.
#
# Triggers:
#   - Manual dispatch (Actions tab → Run workflow)
#   - Push of a tag matching v* (release flow)
#
# Required GitHub repo secrets:
#   SUPABASE_ACCESS_TOKEN              — sbp_… personal access token
#   TAURI_SIGNING_PRIVATE_KEY          — full contents of ~/.tauri/trackforce-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — empty string if generated without password
# Optional:
#   SUPABASE_PROJECT_REF               — defaults to ttjazaxjhzvrzhptrpmd
#
# This workflow builds OS installers (.pkg/.msi/.deb) AND updater bundles
# (.app.tar.gz/.msi.zip/.AppImage.tar.gz) signed with the Tauri updater key.
# After all builds finish, the `manifest` job aggregates the signatures into
# latest.json so existing agents can auto-update.

name: Build & Publish Agent

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  SUPABASE_BASE_URL: ${{ secrets.SUPABASE_BASE_URL || 'https://api-ems.wellnessextract.com' }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ttjazaxjhzvrzhptrpmd' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: app
            artifact_glob: agent/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            remote_name: Security-Assistant-macOS-arm64-${{ github.ref_name }}.pkg
            packager: pkg
          # macOS Intel: cross-compile from macos-14 (ARM) using rust target.
          # macos-13 (Intel) GitHub runners are deprecated and pool is unreliable.
          - os: macos-14
            target: x86_64-apple-darwin
            bundle: app
            artifact_glob: agent/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            remote_name: Security-Assistant-macOS-x64-${{ github.ref_name }}.pkg
            packager: pkg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact_glob: agent/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            remote_name: Security-Assistant-Windows-${{ github.ref_name }}.exe
            packager: passthrough
          # Same Windows toolchain, but emit an MSI for MDM deployment
          # (Intune / Workspace ONE / AppLocker — most enterprise installers
          # ingest MSI more cleanly than NSIS). Tauri builds MSI via WiX 3,
          # which is auto-installed by the official setup-tauri actions.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            artifact_glob: agent/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            remote_name: Security-Assistant-Windows-${{ github.ref_name }}.msi
            packager: passthrough
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact_glob: agent/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            remote_name: security-assistant_${{ github.ref_name }}_amd64.deb
            packager: passthrough

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libx11-dev \
            libxdo-dev \
            libxss-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libdrm-dev

      - name: Install agent JS deps
        working-directory: agent
        run: npm ci || npm install

      # GitHub Secrets sometimes preserve trailing whitespace/newline from paste,
      # which breaks Tauri's base64 decode (`Invalid symbol 10, offset N`).
      # Strip ALL whitespace before passing to the build.
      - name: Sanitize signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          CLEAN=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN" >> "$GITHUB_ENV"
          echo "::add-mask::$CLEAN"
          echo "Sanitized signing key (length: ${#CLEAN})"

      # Drop the right ffmpeg binary into resources/ so Tauri bundles it inside
      # the .app / .msi / .deb. Macs need this for TCC reasons (a child binary
      # downloaded at runtime gets its own permission identity and macOS keeps
      # re-prompting). Bundling means ffmpeg lives inside the signed bundle and
      # inherits the parent process's Screen Recording grant. Same idea on
      # Windows and Linux just for first-clip latency.
      - name: Bundle ffmpeg for ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent/src-tauri/resources
          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              URL="https://api-ems.wellnessextract.com/storage/v1/object/public/ffmpeg/ffmpeg-macos-universal"
              OUT="agent/src-tauri/resources/ffmpeg"
              ;;
            x86_64-pc-windows-msvc)
              URL="https://api-ems.wellnessextract.com/storage/v1/object/public/ffmpeg/ffmpeg-windows-x64.exe"
              OUT="agent/src-tauri/resources/ffmpeg.exe"
              ;;
            x86_64-unknown-linux-gnu)
              URL="https://api-ems.wellnessextract.com/storage/v1/object/public/ffmpeg/ffmpeg-linux-x64"
              OUT="agent/src-tauri/resources/ffmpeg"
              ;;
            *)
              echo "no ffmpeg mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          curl -fL --retry 3 "$URL" -o "$OUT"
          chmod +x "$OUT" || true
          ls -lh "$OUT"

      # Pull the per-platform RustDesk runtime tree from Supabase Storage's
      # `rustdesk` bucket (packaged by scripts/package-rustdesk.sh from the
      # upstream releases) and extract it under resources/rustdesk/ so
      # Tauri bundles the whole tree inside the .app / .msi / .deb.
      # GPL-3.0 "use" boundary — never linked, spawned as a subprocess.
      # Soft-fails: if the zip doesn't exist yet, the agent ships without
      # remote-desktop and the listener cleanly denies sessions with
      # "no rustdesk binary bundled".
      - name: Bundle rustdesk for ${{ matrix.target }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p agent/src-tauri/resources/rustdesk
          case "${{ matrix.target }}" in
            # macOS: DO NOT bundle RustDesk into the .app on macOS.
            # RustDesk is a Flutter app whose upstream builds ship with
            # signatures from RustDesk's own dev team + entitlements
            # referencing that team ID. Re-signing every nested Mach-O
            # + framework under our Developer ID does NOT reliably
            # convince Apple's notarizer (v0.6.10 → v0.6.13 all failed
            # with the same 20+ "signature invalid" errors even after
            # verified-valid-on-disk local re-sign passes).
            # Trade-off: macOS agents ship without in-bundle remote-
            # desktop; the listener responds "no rustdesk binary
            # bundled" and the feature is silently disabled on Mac.
            # Follow-up: download RustDesk at first use into
            # ~/Library/Application Support/RudransAgent/rustdesk/,
            # outside the notarized .app so Apple never inspects it.
            aarch64-apple-darwin|x86_64-apple-darwin)
              echo "skipping rustdesk bundle for ${{ matrix.target }} (macOS notarization compatibility)"
              exit 0
              ;;
            x86_64-pc-windows-msvc)   ZIP=rustdesk-windows-x64.zip ;;
            x86_64-unknown-linux-gnu) ZIP=rustdesk-linux-x64.zip   ;;
          esac
          URL="https://api-ems.wellnessextract.com/storage/v1/object/public/rustdesk/$ZIP"
          if curl -fL --retry 3 "$URL" -o /tmp/rustdesk.zip; then
            unzip -q /tmp/rustdesk.zip -d agent/src-tauri/resources/rustdesk
            # Ensure execute bit on launchers (zip preserves mode but be safe).
            find agent/src-tauri/resources/rustdesk -type f \
              \( -name 'RustDesk' -o -name 'rustdesk' -o -name 'rustdesk.exe' \) \
              -exec chmod +x {} \;
            echo "rustdesk extracted for ${{ matrix.target }}:"
            du -sh agent/src-tauri/resources/rustdesk
            find agent/src-tauri/resources/rustdesk -maxdepth 3 -type f | head -10 || true
          else
            echo "WARN: $ZIP not in Storage — agent will ship without remote-desktop"
          fi

      # Import the Apple Developer ID Application cert into a temporary
      # keychain so Tauri's bundler can codesign the .app with a
      # notarizable signature. Combined with the notarization step
      # below (via App Store Connect API key) this eliminates the
      # Gatekeeper "unidentified developer" prompt customers see when
      # they open the .pkg — Apple's servers issue a notarization
      # ticket stapled to the bundle, macOS trusts it silently on
      # first launch.
      - name: Import Apple Developer ID cert
        if: matrix.os == 'macos-14'
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # Random keychain password — this keychain is throwaway,
          # nothing survives the runner. Format is `security`-friendly.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # The .p12 exported by macOS `security export` uses the modern
          # PBES2 envelope which SecKeychainItemImport reads fine — no
          # need for openssl -legacy translation like the old self-signed
          # cert path required.
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          echo "Imported. Identities now available:"
          security find-identity -v -p codesigning build.keychain

      # Deep-re-sign every bundled third-party binary with our own
      # Developer ID cert BEFORE Tauri builds. Notarytool inspects
      # every executable + framework inside the .app; if any inner
      # signature was issued by a different cert (or self-signed
      # like upstream RustDesk builds), notarization rejects with
      # "The signature of the binary is invalid" and Tauri's build
      # step fails at the notarize stage.
      #
      # `codesign --force --deep --sign … --options runtime` overwrites
      # every existing signature top-down. --deep is deprecated but
      # still the pragmatic way to re-sign nested frameworks; the
      # replacement (individual `codesign` calls per Mach-O) works
      # too but is ~40 lines here vs 3.
      - name: Deep-re-sign bundled third-party binaries
        if: matrix.os == 'macos-14'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          BASE=agent/src-tauri/resources

          # `codesign --deep` claims to recursively re-sign a bundle
          # but empirically MISSES nested Mach-O binaries inside
          # .framework directories (verified: v0.6.10 + v0.6.11 both
          # failed notarization with "signature invalid" for the exact
          # framework binaries we thought --deep had covered). Apple's
          # recommended approach for nested bundles is to sign
          # bottom-up: every Mach-O file first, then every framework
          # bundle, finally the containing .app. Doing it manually.
          resign_bundle() {
            local APP="$1"
            [ -d "$APP" ] || return 0
            echo "── Re-signing $APP ──"
            # 1) Every Mach-O executable / dylib in the tree.
            find "$APP" -type f | while read -r f; do
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                codesign --force --sign "$IDENTITY" \
                  --options runtime --timestamp "$f" 2>&1 \
                  | grep -v "^$" || true
              fi
            done
            # 2) Every .framework bundle, deepest first.
            find "$APP" -type d -name "*.framework" -depth | while read -r fw; do
              codesign --force --sign "$IDENTITY" \
                --options runtime --timestamp "$fw" 2>&1 \
                | grep -v "^$" || true
            done
            # 3) The outer bundle itself.
            codesign --force --sign "$IDENTITY" \
              --options runtime --timestamp "$APP" 2>&1 \
              | grep -v "^$" || true
            # Verify — codesign --verify --deep --strict fails loud
            # if any nested signature is still invalid.
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5
          }

          if [ -d "$BASE/rustdesk/RustDesk.app" ]; then
            resign_bundle "$BASE/rustdesk/RustDesk.app"
          fi
          # ffmpeg (single Mach-O binary). Downloaded from our Supabase
          # bucket — was built ad-hoc without a Developer ID signature.
          if [ -f "$BASE/ffmpeg" ]; then
            echo "── Re-signing ffmpeg ──"
            codesign --force --sign "$IDENTITY" \
              --options runtime --timestamp "$BASE/ffmpeg"
          fi
          echo "Third-party binaries re-signed under our Developer ID."

      # Materialise the App Store Connect API .p8 to disk — Tauri's
      # bundler + xcrun notarytool both take a file path (not the key
      # contents inline). Location is under RUNNER_TEMP so it vanishes
      # when the runner is destroyed at the end of the job.
      - name: Write notarization API key to disk
        if: matrix.os == 'macos-14'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Wrote AuthKey_${KEY_ID}.p8 (bytes: $(wc -c <"$KEY_PATH"))"

      - name: Build agent
        working-directory: agent
        env:
          # TAURI_SIGNING_PRIVATE_KEY is set above via GITHUB_ENV
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri 2 macOS bundler picks this identity from the build
          # keychain to sign the .app. Value is
          # "Developer ID Application: Aman Saini (THJMM6C3XU)".
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-14' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Team ID used by Tauri to build the correct entitlements +
          # Designated Requirement string.
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}
          # Notarization credentials (App Store Connect API key). Tauri
          # 2's bundler runs `xcrun notarytool submit --wait` when these
          # are present AND `--options runtime` is on. Then it staples
          # the ticket to the .app so the Gatekeeper check works offline.
          # Deliberately DO NOT pass APPLE_API_ISSUER / APPLE_API_KEY /
          # APPLE_API_KEY_PATH here. If those are set Tauri notarizes
          # inline, but its bundle-copy step scrambles signatures on
          # nested Frameworks inside RustDesk.app — every attempt
          # v0.6.10–v0.6.12 failed at Tauri's own notarize call with
          # "The signature of the binary is invalid" for the same 20+
          # nested framework binaries even though our pre-sign step
          # verified them as valid on disk right before Tauri ran.
          # Instead: let Tauri just SIGN + BUNDLE, then the two post-
          # build steps below re-sign every Mach-O bottom-up on the
          # FINAL bundle path and submit for notarization ourselves.
        run: npm run tauri build -- --bundles ${{ matrix.bundle }} --target ${{ matrix.target }}

      # Deep bottom-up re-sign the final .app that Tauri produced.
      # Tauri's build copies our resources/rustdesk/RustDesk.app tree
      # into the output bundle in a way that strips the framework
      # signatures we applied earlier. Re-doing the exact same signing
      # pass here on the post-build path lands the signatures in
      # their FINAL location, so nothing touches them again before
      # notarization.
      - name: Post-build re-sign the built .app
        if: matrix.os == 'macos-14'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          APP=$(ls -d agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          echo "Signing final bundle: $APP"
          # (a) every Mach-O executable / dylib
          find "$APP" -type f | while read -r f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign --force --sign "$IDENTITY" \
                --options runtime --timestamp "$f" 2>&1 \
                | grep -v "^$" || true
            fi
          done
          # (b) every framework bundle, deepest first
          find "$APP" -type d -name "*.framework" -depth | while read -r fw; do
            codesign --force --sign "$IDENTITY" \
              --options runtime --timestamp "$fw" 2>&1 \
              | grep -v "^$" || true
          done
          # (c) every nested app bundle (Security Assistant.app contains
          # RustDesk.app which contains its OWN Contents/MacOS/…). Depth-
          # first so inner nested .apps are signed before their outer.
          find "$APP" -type d -name "*.app" -depth | while read -r inner; do
            [ "$inner" = "$APP" ] && continue   # save outer for last
            codesign --force --sign "$IDENTITY" \
              --options runtime --timestamp "$inner" 2>&1 \
              | grep -v "^$" || true
          done
          # (d) the outer Security Assistant.app itself
          codesign --force --sign "$IDENTITY" \
            --options runtime --timestamp "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5
          echo "✓ Final .app fully re-signed bottom-up."

      # Notarize the built .app with the App Store Connect API key
      # (same key as Tauri would have used inline, only now the .app
      # signatures are in their final post-copy location so Apple's
      # server accepts them). `--wait` blocks until Apple returns a
      # verdict (~1-5 min), then `stapler staple` embeds the ticket so
      # Gatekeeper approves the app offline.
      - name: Notarize + staple built .app
        if: matrix.os == 'macos-14'
        run: |
          set -e
          APP=$(ls -d agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          ZIP="$RUNNER_TEMP/$(basename "$APP").zip"
          # `ditto -c -k --keepParent` — Apple-recommended zip; keeps
          # xattrs + symlinks that `zip -r` would drop and break the
          # nested-code signatures.
          ditto -c -k --keepParent "$APP" "$ZIP"

          # Submit once (no --wait) so we own the submission ID even
          # if the poll leg later hits a network hiccup. `--wait` on
          # its own has bitten us before: GitHub runner's network
          # dropped mid-poll (NSURLError -1009) and the whole notarize
          # died, forcing a resubmit that starts Apple's ~30 min
          # processing from scratch.
          SUBMIT_JSON=$(xcrun notarytool submit "$ZIP" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --output-format json)
          SUBMIT_ID=$(echo "$SUBMIT_JSON" | jq -r '.id')
          echo "notarize submission id: $SUBMIT_ID"

          # Poll status with tolerance for transient network errors.
          # Apple's notary service returns:
          #   • In Progress   — keep polling
          #   • Accepted      — success → staple
          #   • Invalid       — Apple rejected the bundle → fail
          #   • Rejected      — auth failure → fail
          # 40 iterations × 45 s = 30 min ceiling. If we hit that
          # without a verdict Apple is congested; fail this job and
          # the next tag push retries. We DO NOT resubmit here —
          # a fresh submit restarts Apple's 5-30 min queue.
          for i in $(seq 1 40); do
            sleep 45
            INFO_JSON=$(xcrun notarytool info "$SUBMIT_ID" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
              --output-format json 2>/dev/null || echo '{"status":"NetworkError"}')
            STATUS=$(echo "$INFO_JSON" | jq -r '.status // "NetworkError"')
            echo "  [$i/40] $STATUS"
            case "$STATUS" in
              Accepted)     break ;;
              Invalid|Rejected)
                echo "notarize failed with $STATUS — fetching log:"
                xcrun notarytool log "$SUBMIT_ID" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
                  --issuer "${{ secrets.APPLE_API_ISSUER_ID }}"
                exit 1 ;;
              # In Progress / NetworkError → keep polling
            esac
          done
          [ "$STATUS" = "Accepted" ] || { echo "notarize did not accept within 30 min (last status: $STATUS)"; exit 1; }

          xcrun stapler staple "$APP"
          rm -f "$ZIP"
          echo "✓ .app notarized + stapled (submission $SUBMIT_ID)."

      # Read the actual product version from tauri.conf.json so artifact names
      # are deterministic across triggers (push tag, workflow_dispatch on main, …).
      # Without this, dispatch-on-main runs overwrite tag runs in Storage.
      - name: Read product version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version v$VERSION (from tauri.conf.json, not ref_name)"

      # Compute the friendly remote_name for the OS installer (.pkg / .msi
      # / .deb) using the runtime VERSION, not the matrix-level
      # `github.ref_name` placeholder. workflow_dispatch runs from main
      # would otherwise upload as `…-main.pkg` and the setup page (which
      # expects `…-v0.2.33.pkg`) would 404.
      - name: Compute remote artifact name
        id: remote
        shell: bash
        run: |
          V="v${{ steps.version.outputs.version }}"
          # Strip the templated ref_name and replace with the version.
          NAME="${{ matrix.remote_name }}"
          NEW="${NAME//${{ github.ref_name }}/$V}"
          echo "name=$NEW" >> "$GITHUB_OUTPUT"
          echo "remote=$NEW (was ${{ matrix.remote_name }})"

      # Collect the updater-format bundle (.tar.gz / .msi) AND its .sig file
      # produced by Tauri when TAURI_SIGNING_PRIVATE_KEY is set. We need both for
      # the latest.json manifest.
      - name: Collect updater bundle + signature
        id: updater
        shell: bash
        run: |
          BASE="agent/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          # Tauri writes the updater archive with the productName ("TrackForce
          # Agent" — space in the filename) which breaks Supabase Storage URLs,
          # so we rename to a URL-safe hyphenated form before upload. We use a
          # case statement (NOT associative arrays — macOS ships bash 3.2 which
          # doesn't support `declare -A`).
          # Tauri 2 updater bundle naming (verified against actual build output):
          #   macOS:   <name>.app.tar.gz   + .app.tar.gz.sig
          #   Windows MSI:  <name>.msi      + .msi.sig         (not wrapped in .zip!)
          #   Windows NSIS: <name>.exe      + .exe.sig
          #   AppImage:     <name>.AppImage + .AppImage.sig    (newer Tauri)
          for sub in macos msi nsis appimage deb; do
            case "$sub" in
              macos)    EXT="app.tar.gz" ;;
              msi)      EXT="msi" ;;
              nsis)     EXT="exe" ;;
              appimage) EXT="AppImage" ;;
              deb)      EXT="deb" ;;
            esac
            for f in "$BASE/$sub"/*."$EXT"; do
              if [ -f "$f" ] && [ -f "${f}.sig" ]; then
                echo "found: $f"
                SAFE="Security-Assistant-${{ matrix.target }}-v${{ steps.version.outputs.version }}.${EXT}"
                cp "$f" "agent/$SAFE"
                cp "${f}.sig" "agent/${SAFE}.sig"
                echo "bundle=agent/$SAFE" >> "$GITHUB_OUTPUT"
                echo "sig=agent/${SAFE}.sig" >> "$GITHUB_OUTPUT"
                echo "name=$SAFE" >> "$GITHUB_OUTPUT"
                break 2
              fi
            done
          done

      - name: Upload updater bundle to Supabase
        if: steps.updater.outputs.bundle != ''
        shell: bash
        run: |
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          # Bundles can be 50–150 MB. Self-hosted Supabase storage on EC2
          # sometimes hangs mid-stream during high CI traffic; add an explicit
          # max-time + retries so a single transient blip doesn't fail the
          # whole run (v0.6.0 first push hit curl exit 28 here).
          for f in "${{ steps.updater.outputs.bundle }}" "${{ steps.updater.outputs.sig }}"; do
            REMOTE=$(basename "$f")
            URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/${REMOTE}"
            HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
              --max-time 900 --retry 3 --retry-delay 10 --retry-all-errors \
              -X POST "$URL" \
              -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" || echo "curl_failed")
            if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
              HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
                --max-time 900 --retry 3 --retry-delay 10 --retry-all-errors \
                -X PUT "$URL" \
                -H "Authorization: Bearer $SR_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$f" || echo "curl_failed")
            fi
            [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "updater upload $f failed: $HTTP"; cat /tmp/r.json; exit 1; }
            echo "Uploaded $REMOTE"
          done

      # Save the signature contents + URL so the manifest job can build latest.json
      - name: Save updater metadata
        if: steps.updater.outputs.bundle != ''
        shell: bash
        run: |
          NAME="${{ steps.updater.outputs.name }}"
          SIG=$(cat "${{ steps.updater.outputs.sig }}")
          URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/${NAME}"
          mkdir -p meta
          cat > "meta/${{ matrix.target }}.json" <<EOF
          { "target": "${{ matrix.target }}", "url": "$URL", "signature": $(jq -Rs '.' <<<"$SIG") }
          EOF

      - name: Upload metadata as artifact
        if: steps.updater.outputs.bundle != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-meta-${{ matrix.target }}
          path: meta/${{ matrix.target }}.json

      - name: Wrap macOS .app into .pkg
        if: matrix.packager == 'pkg'
        run: |
          APP_PATH=$(ls -d agent/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          STAGE=agent/dist-mac/stage
          SCRIPTS_DIR=agent/dist-mac/scripts
          rm -rf "$STAGE" "$SCRIPTS_DIR"
          mkdir -p "$STAGE/Applications" "$SCRIPTS_DIR" agent/dist-mac
          cp -R "$APP_PATH" "$STAGE/Applications/"

          # Use the externally-tracked postinstall (agent/scripts/pkg-scripts/postinstall)
          # so local-dev pkg builds (agent/scripts/build-mac-pkg.sh) and CI builds run
          # the exact same logic. The script (a) imports our self-signed root CA into
          # the System keychain so the .app's signature is trusted, (b) strips the
          # quarantine xattr so Gatekeeper doesn't warn on first launch, and (c) resets
          # any stale TCC entries from prior ad-hoc-signed builds so Screen Recording
          # gets re-granted ONCE against the new stable signing identity.
          cp agent/scripts/pkg-scripts/postinstall "$SCRIPTS_DIR/postinstall"
          chmod 755 "$SCRIPTS_DIR/postinstall"

          # Use the actual product version from tauri.conf.json so each pkg's
          # Info.plist version matches the .app inside it. The previous hard-
          # coded "0.1.0" was visibly stale in Installer.app's UI.
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")

          pkgbuild --root "$STAGE" \
            --identifier com.rudrans.agent \
            --version "$VERSION" \
            --install-location "/" \
            --scripts "$SCRIPTS_DIR" \
            "agent/dist-mac/${{ steps.remote.outputs.name }}.unsigned"

          # Sign the outer .pkg with the "Developer ID Installer"
          # certificate so Gatekeeper trusts the installer itself
          # (not just the .app inside it). Without this the customer
          # sees an "unidentified developer" prompt at pkg-open time
          # even though the .app is notarized. productsign is the
          # macOS-signed-package-signing utility; identity has to be
          # an Installer cert, not the Application cert.
          #
          # The build.keychain was created by the earlier "Import
          # Apple Developer ID cert" step and had productsign
          # authorised via -T /usr/bin/productsign.
          productsign --sign "${{ secrets.APPLE_INSTALLER_IDENTITY }}" \
            --keychain build.keychain \
            "agent/dist-mac/${{ steps.remote.outputs.name }}.unsigned" \
            "agent/dist-mac/${{ steps.remote.outputs.name }}"
          rm "agent/dist-mac/${{ steps.remote.outputs.name }}.unsigned"

          # Notarize the pkg — pkg notarization is separate from the
          # .app notarization done during `tauri build`. Uses the same
          # App Store Connect API key. --wait blocks until Apple's
          # servers issue a ticket (~2-5 min). Ticket is then stapled
          # so Gatekeeper approves the pkg without a network call.
          xcrun notarytool submit \
            "agent/dist-mac/${{ steps.remote.outputs.name }}" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "agent/dist-mac/${{ steps.remote.outputs.name }}"
          echo "Pkg signed + notarized + stapled."

      - name: Locate artifact (passthrough)
        if: matrix.packager == 'passthrough'
        id: passthrough
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.artifact_glob }} | head -1)
          mkdir -p agent/dist
          cp "$FILE" "agent/dist/${{ steps.remote.outputs.name }}"
          echo "path=agent/dist/${{ steps.remote.outputs.name }}" >> $GITHUB_OUTPUT

      - name: Upload to Supabase Storage
        shell: bash
        run: |
          if [ "${{ matrix.packager }}" = "pkg" ]; then
            ARTIFACT="agent/dist-mac/${{ steps.remote.outputs.name }}"
          else
            ARTIFACT="agent/dist/${{ steps.remote.outputs.name }}"
          fi
          # Resolve service_role key
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          UPLOAD_URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/${{ steps.remote.outputs.name }}"
          # Upsert: PUT replaces if exists.
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -X POST "$UPLOAD_URL" \
            -H "Authorization: Bearer $SR_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ARTIFACT")
          if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -X PUT "$UPLOAD_URL" \
              -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$ARTIFACT")
          fi
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "upload failed: HTTP $HTTP"; cat /tmp/r.json; exit 1
          fi
          echo "Uploaded → ${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/${{ steps.remote.outputs.name }}"

      - name: Upload artifact to GitHub run (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.remote.outputs.name }}
          path: |
            agent/dist-mac/${{ steps.remote.outputs.name }}
            agent/dist/${{ steps.remote.outputs.name }}
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # After all OS builds finish, gather the per-target signature metadata into a
  # single latest.json and upload it. Existing agents poll this every 30 min;
  # when the version changes, they download + verify + install + restart.
  # ---------------------------------------------------------------------------
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all per-target metadata artifacts
        uses: actions/download-artifact@v4
        with:
          path: meta-all
          pattern: updater-meta-*
          merge-multiple: true

      - name: Build latest.json
        id: manifest
        run: |
          set -e
          VERSION=$(node -p "require('./agent/src-tauri/tauri.conf.json').version")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Map target → tauri platform key
          declare -A KEY=(
            [aarch64-apple-darwin]=darwin-aarch64
            [x86_64-apple-darwin]=darwin-x86_64
            [x86_64-pc-windows-msvc]=windows-x86_64
            [x86_64-unknown-linux-gnu]=linux-x86_64
          )
          PLATFORMS_JSON=""
          for f in meta-all/*.json; do
            [ -f "$f" ] || continue
            TARGET=$(jq -r '.target' "$f")
            URL=$(jq -r '.url' "$f")
            SIG=$(jq -r '.signature' "$f")
            PKEY="${KEY[$TARGET]:-}"
            [ -z "$PKEY" ] && continue
            ENTRY=$(jq -n --arg s "$SIG" --arg u "$URL" '{signature:$s,url:$u}')
            if [ -z "$PLATFORMS_JSON" ]; then PLATFORMS_JSON="\"$PKEY\":$ENTRY"
            else PLATFORMS_JSON+=",\"$PKEY\":$ENTRY"; fi
          done
          cat > /tmp/latest.json <<EOF
          { "version": "$VERSION", "notes": "TrackForce Agent v$VERSION", "pub_date": "$PUB_DATE", "platforms": { $PLATFORMS_JSON } }
          EOF
          jq . /tmp/latest.json
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload latest.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SR_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          URL="${{ env.SUPABASE_BASE_URL }}/storage/v1/object/releases/latest.json"
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -X POST "$URL" -H "Authorization: Bearer $SR_KEY" \
            -H "Content-Type: application/json" --data-binary "@/tmp/latest.json")
          if [ "$HTTP" = "409" ] || [ "$HTTP" = "400" ]; then
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -X PUT "$URL" -H "Authorization: Bearer $SR_KEY" \
              -H "Content-Type: application/json" --data-binary "@/tmp/latest.json")
          fi
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || { echo "upload failed: $HTTP"; cat /tmp/r.json; exit 1; }
          echo "✅ latest.json published → ${{ env.SUPABASE_BASE_URL }}/storage/v1/object/public/releases/latest.json"
