<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SECURITY REVIEW: baseline CSP that is safe to ship via <meta> (applies
         in dev too, so it must NOT restrict script/connect or it would break
         Vite HMR). object-src 'none' blocks plugin/embed injection and
         base-uri 'self' blocks <base>-tag hijacking. The FULL policy
         (frame-ancestors, script-src 'self', scoped connect-src, etc.) is set
         as HTTP headers for production in public/_headers — those directives
         are ignored when delivered via meta. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/webp" href="/rudrans/rudrans-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rudrans — Employee Monitoring &amp; Workforce Analytics Software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marketing-site fonts (src/styles/rudrans-site.css relies on these;
         loaded here in parallel instead of a render-blocking CSS @import). -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Default metadata for first paint; each marketing route overwrites
         these at runtime via src/lib/seo.ts (useSeo). -->
    <meta name="description" content="Rudrans gives businesses real-time visibility into employee activity, productivity and security — live screens, activity timelines, DLP and device control in one dashboard. Lightweight agent for Windows, macOS & Ubuntu.">
    <meta property="og:site_name" content="Rudrans">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rudrans — Employee Monitoring &amp; Workforce Analytics Software">
    <meta property="og:image" content="https://rudrans.com/rudrans/why-dashboard2.webp">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
